name: Update animated five-year contribution heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-contribution-heatmap.mjs"
      - ".github/workflows/contribution-heatmap.yml"

permissions:
  contents: write

concurrency:
  group: contribution-heatmap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate the combined five-year animated heatmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-contribution-heatmap.mjs

      - name: Preserve generated files for publishing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contribution-heatmap-output"
          cp dist/contributions-2022-2026-snake-light.svg "$RUNNER_TEMP/contribution-heatmap-output/"
          cp dist/contributions-2022-2026-snake-dark.svg "$RUNNER_TEMP/contribution-heatmap-output/"

      - name: Publish the two theme variants to the output branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -D output 2>/dev/null || true
          git checkout --orphan output
          git rm -rf . || true
          cp "$RUNNER_TEMP/contribution-heatmap-output/contributions-2022-2026-snake-light.svg" .
          cp "$RUNNER_TEMP/contribution-heatmap-output/contributions-2022-2026-snake-dark.svg" .
          git add -f contributions-2022-2026-snake-light.svg contributions-2022-2026-snake-dark.svg
          git commit -m "Update animated 2022-2026 contribution heatmap"
          git push origin HEAD:output --force
